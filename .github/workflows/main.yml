name: Build MagicSMP Sell Pages Fix

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: guard/pom.xml

      - name: Verify files
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f | sort

          test -f baseline/MagicSMP.jar || {
            echo "ERROR: baseline/MagicSMP.jar is missing"
            exit 1
          }

          test -f guard/pom.xml || {
            echo "ERROR: guard/pom.xml is missing"
            exit 1
          }

          test -f build.sh || {
            echo "ERROR: build.sh is missing"
            exit 1
          }

      - name: Install MagicSMP dependency
        run: |
          mvn install:install-file \
            -Dfile=baseline/MagicSMP.jar \
            -DgroupId=com.bx \
            -DartifactId=magicsmp-current \
            -Dversion=1.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build Sell Pages Fix
        working-directory: guard
        run: mvn -B clean package

      - name: Build final MagicSMP
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify final JAR
        run: |
          test -f build/MagicSMP.jar || {
            echo "ERROR: Final MagicSMP.jar wasn't created"
            exit 1
          }

          ls -lh build/MagicSMP.jar

      - name: Upload MagicSMP
        uses: actions/upload-artifact@v4
        with:
          name: MagicSMP-SellPages-Fix
          path: build/MagicSMP.jar
          if-no-files-found: error
