name: Build MagicSMP Sell Pages Fix

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Show repository files
        run: |
          echo "=== Repository files ==="
          find . -maxdepth 6 -type f | sort

      - name: Find Maven project
        id: maven
        shell: bash
        run: |
          POM=$(find . -type f -name "pom.xml" | head -n 1)

          if [ -z "$POM" ]; then
            echo "ERROR: No pom.xml exists anywhere in the repository."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$POM")

          echo "Found pom.xml: $POM"
          echo "Maven project directory: $PROJECT_DIR"

          echo "pom=$POM" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Find baseline MagicSMP JAR
        id: baseline
        shell: bash
        run: |
          JAR=$(find . -type f -iname "MagicSMP*.jar" \
            ! -path "*/target/*" \
            ! -path "*/build/*" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: Could not find the baseline MagicSMP JAR."
            exit 1
          fi

          echo "Found baseline JAR: $JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Install MagicSMP dependency
        run: |
          mvn install:install-file \
            -Dfile="${{ steps.baseline.outputs.jar }}" \
            -DgroupId=com.bx \
            -DartifactId=magicsmp-current \
            -Dversion=1.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Build Sell Pages Fix
        working-directory: ${{ steps.maven.outputs.project_dir }}
        run: mvn -B clean package

      - name: Run MagicSMP patcher
        shell: bash
        run: |
          if [ -f "build.sh" ]; then
            chmod +x build.sh
            ./build.sh
          else
            BUILD_SCRIPT=$(find . -type f -name "build.sh" | head -n 1)

            if [ -z "$BUILD_SCRIPT" ]; then
              echo "ERROR: build.sh could not be found."
              exit 1
            fi

            chmod +x "$BUILD_SCRIPT"

            SCRIPT_DIR=$(dirname "$BUILD_SCRIPT")
            SCRIPT_NAME=$(basename "$BUILD_SCRIPT")

            cd "$SCRIPT_DIR"
            "./$SCRIPT_NAME"
          fi

      - name: Find final MagicSMP JAR
        id: final
        shell: bash
        run: |
          if [ -f "build/MagicSMP.jar" ]; then
            FINAL_JAR="build/MagicSMP.jar"
          else
            FINAL_JAR=$(find . -type f -path "*/build/MagicSMP.jar" | head -n 1)
          fi

          if [ -z "$FINAL_JAR" ] || [ ! -f "$FINAL_JAR" ]; then
            echo "ERROR: Final patched MagicSMP.jar was not created."
            echo ""
            echo "JAR files that do exist:"
            find . -type f -name "*.jar" -print
            exit 1
          fi

          echo "Final JAR: $FINAL_JAR"
          ls -lh "$FINAL_JAR"

          echo "jar=$FINAL_JAR" >> "$GITHUB_OUTPUT"

      - name: Upload MagicSMP
        uses: actions/upload-artifact@v4
        with:
          name: MagicSMP-SellPages-Fix
          path: ${{ steps.final.outputs.jar }}
          if-no-files-found: error
          retention-days: 30
